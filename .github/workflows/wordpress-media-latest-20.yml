name: WordPress media latest test

on:
  workflow_dispatch:
    inputs:
      media_limit:
        description: 'Number of latest media images to fetch.'
        required: false
        default: '300'
        type: choice
        options:
          - '300'
          - '800'
          - '1300'
          - '2000'
          - all
      ai_image_limit:
        description: 'Number of unknown thumbnail images to classify with OpenAI vision. Use 0 to disable.'
        required: false
        default: '50'
        type: choice
        options:
          - '0'
          - '50'
          - '100'

permissions:
  contents: read

jobs:
  wp-media-test:
    name: GET latest WordPress media items
    runs-on: ubuntu-latest
    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
      OUTPUT_DIR: wp-media-test-output
      MEDIA_LIMIT: ${{ inputs.media_limit || '300' }}
      AI_IMAGE_LIMIT: ${{ inputs.ai_image_limit || '50' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate required secrets and inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${WP_APP_PASSWORD}"
          python3 - <<'PY'
          import os
          import sys

          missing = False
          for name in ("WP_URL", "WP_USER", "WP_APP_PASSWORD"):
              if not os.environ.get(name):
                  print(f"::error title=Missing secret::GitHub Secret {name} is required for this manual workflow.")
                  missing = True

          media_limit = os.environ.get("MEDIA_LIMIT", "300")
          if media_limit not in {"300", "800", "1300", "2000", "all"}:
              print("::error title=Invalid media_limit::media_limit must be one of: 300, 800, 1300, 2000, all.")
              missing = True

          ai_image_limit = os.environ.get("AI_IMAGE_LIMIT", "50")
          if ai_image_limit not in {"0", "50", "100"}:
              print("::error title=Invalid ai_image_limit::ai_image_limit must be one of: 0, 50, 100.")
              missing = True

          if missing:
              sys.exit(2)
          PY

      - name: Run latest media GET export
        id: export
        shell: bash
        run: |
          set -uo pipefail
          echo "::add-mask::${WP_APP_PASSWORD}"
          mkdir -p "${OUTPUT_DIR}"

          ai_args=()
          if [ "${AI_IMAGE_LIMIT}" != "0" ]; then
            ai_args=(--ai-classify --ai-limit "${AI_IMAGE_LIMIT}" --ai-model "${OPENAI_MODEL}")
          fi
          python3 scripts/organize_wp_media.py --output-dir "${OUTPUT_DIR}" --latest-20 --limit "${MEDIA_LIMIT}" --skip-posts --timeout 30 --retries 1 "${ai_args[@]}" > "${OUTPUT_DIR}/run.stdout.log" 2> "${OUTPUT_DIR}/run.stderr.log"
          status=$?

          if [ -s "${OUTPUT_DIR}/run.stdout.log" ]; then
            echo "::group::organizer stdout"
            cat "${OUTPUT_DIR}/run.stdout.log"
            echo "::endgroup::"
          fi
          if [ -s "${OUTPUT_DIR}/run.stderr.log" ]; then
            echo "::group::organizer stderr"
            cat "${OUTPUT_DIR}/run.stderr.log"
            echo "::endgroup::"
          fi
          if [ -f "${OUTPUT_DIR}/media-organizer-summary.json" ]; then
            echo "::group::media organizer summary"
            cat "${OUTPUT_DIR}/media-organizer-summary.json"
            echo "::endgroup::"
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error title=WordPress media export failed::Latest-20 GET export failed. Check media-organizer-summary.json and run.stderr.log in the artifact."
            exit "${status}"
          fi

      - name: Verify CSV and GET-only safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          output = Path("wp-media-test-output")
          index_path = output / "image-index.csv"
          groups_path = output / "image-groups.csv"
          ai_log_path = output / "ai-category-log.csv"
          run_log_path = output / "media-organizer-run-log.csv"
          summary_path = output / "media-organizer-summary.json"

          if not index_path.exists():
              raise SystemExit("image-index.csv was not generated")
          if not groups_path.exists():
              raise SystemExit("image-groups.csv was not generated")
          if not ai_log_path.exists():
              raise SystemExit("ai-category-log.csv was not generated")
          if not run_log_path.exists():
              raise SystemExit("media-organizer-run-log.csv was not generated")
          if not summary_path.exists():
              raise SystemExit("media-organizer-summary.json was not generated")

          with index_path.open(newline="", encoding="utf-8") as file_obj:
              reader = csv.DictReader(file_obj)
              rows = list(reader)
              fieldnames = reader.fieldnames or []
          media_limit_input = os.environ["MEDIA_LIMIT"]
          if media_limit_input == "all":
              media_limit = None
              expected_requested_limit = "all"
          else:
              media_limit = int(media_limit_input)
              expected_requested_limit = media_limit
              if len(rows) > media_limit:
                  raise SystemExit(f"Expected at most {media_limit} media rows, got {len(rows)}")

          required_columns = ["filename", "title", "alt", "category", "ai_category", "ai_reason", "possible_article", "upload_date", "image_url", "local_path"]
          if fieldnames != required_columns:
              raise SystemExit(f"Unexpected image-index.csv columns: {fieldnames}")

          with run_log_path.open(newline="", encoding="utf-8") as file_obj:
              log_rows = list(csv.DictReader(file_obj))
          methods = {row["method"] for row in log_rows if row.get("method")}
          non_get = sorted(method for method in methods if method != "GET")
          if non_get:
              raise SystemExit(f"Forbidden HTTP methods found in run log: {', '.join(non_get)}")

          media_requests = [row for row in log_rows if "/wp-json/wp/v2/media" in row.get("url", "")]
          if not media_requests:
              raise SystemExit("No WordPress media endpoint GET was recorded")
          for request_row in media_requests:
              parsed = parse_qs(urlparse(request_row["url"]).query)
              per_page = int(parsed.get("per_page", ["0"])[0])
              if per_page < 1 or per_page > 100:
                  raise SystemExit(f"Expected media query per_page between 1 and 100, got {per_page}")
              expected = {"orderby": "date", "order": "desc", "media_type": "image"}
              for key, value in expected.items():
                  actual = parsed.get(key, [None])[0]
                  if actual != value:
                      raise SystemExit(f"Expected media query {key}={value}, got {actual}")

          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          expected_ai_enabled = os.environ["AI_IMAGE_LIMIT"] != "0"
          if summary.get("ai_classification_enabled") != expected_ai_enabled:
              raise SystemExit(f"Summary ai_classification_enabled {summary.get('ai_classification_enabled')} does not match expected {expected_ai_enabled}")
          if summary.get("ai_limit") != (int(os.environ["AI_IMAGE_LIMIT"]) if expected_ai_enabled else 0):
              raise SystemExit(f"Summary ai_limit {summary.get('ai_limit')} does not match input {os.environ['AI_IMAGE_LIMIT']}")
          if summary.get("ai_reclassified_count", 0) > summary.get("ai_classified_count", 0):
              raise SystemExit("ai_reclassified_count must be <= ai_classified_count")
          if summary.get("requested_limit") != expected_requested_limit:
              raise SystemExit(f"Summary requested_limit {summary.get('requested_limit')} does not match input {expected_requested_limit}")
          if summary.get("fetched_count") != len(rows):
              raise SystemExit(f"Summary fetched_count {summary.get('fetched_count')} does not match CSV rows {len(rows)}")
          if summary.get("media_count") != len(rows):
              raise SystemExit(f"Summary media_count {summary.get('media_count')} does not match CSV rows {len(rows)}")
          local_paths = [row.get("local_path", "") for row in rows if row.get("local_path")]
          thumbnail_saved_count = summary.get("thumbnail_saved_count", 0)
          thumbnail_error_count = summary.get("thumbnail_error_count", 0)
          if len(local_paths) != thumbnail_saved_count:
              raise SystemExit(f"Summary thumbnail_saved_count {thumbnail_saved_count} does not match local_path count {len(local_paths)}")
          if thumbnail_saved_count + thumbnail_error_count != len(rows):
              raise SystemExit(f"thumbnail_saved_count + thumbnail_error_count ({thumbnail_saved_count} + {thumbnail_error_count}) does not match CSV rows {len(rows)}")
          for local_path in local_paths:
              if not local_path.startswith("thumbnails/"):
                  raise SystemExit(f"local_path must be under thumbnails/: {local_path}")
              if not (output / local_path).is_file():
                  raise SystemExit(f"local_path file does not exist: {local_path}")
          methods_used = set(summary.get("methods_used", []))
          if methods_used - {"GET"}:
              raise SystemExit(f"Forbidden methods in summary: {sorted(methods_used - {'GET'})}")

          with ai_log_path.open(newline="", encoding="utf-8") as file_obj:
              ai_log_reader = csv.DictReader(file_obj)
              ai_log_rows = list(ai_log_reader)
              ai_log_fieldnames = ai_log_reader.fieldnames or []
          required_ai_log_columns = ["filename", "width", "height", "ai_category", "ai_reason", "local_path", "preview_path", "text_category", "ai_image_dimensions", "final_category", "ai_status", "ai_parse_status", "ai_parse_error", "ai_response_text", "ai_http_status", "ai_openai_error_message", "ai_debug_path"]
          if ai_log_fieldnames != required_ai_log_columns:
              raise SystemExit(f"Unexpected ai-category-log.csv columns: {ai_log_fieldnames}")
          if expected_ai_enabled and len(ai_log_rows) != len(rows):
              raise SystemExit(f"Expected AI log rows to match image rows when enabled: {len(ai_log_rows)} != {len(rows)}")
          if not expected_ai_enabled and ai_log_rows:
              raise SystemExit("AI log rows should be empty when AI classification is disabled")
          for row in ai_log_rows:
              debug_path = row.get("ai_debug_path", "")
              if debug_path and not (output / debug_path).is_file():
                  raise SystemExit(f"ai_debug_path file does not exist: {debug_path}")
              if row.get("ai_parse_status") == "http_error" and not row.get("ai_http_status"):
                  raise SystemExit("http_error row must include ai_http_status")

          with groups_path.open(newline="", encoding="utf-8") as file_obj:
              group_reader = csv.DictReader(file_obj)
              group_rows = list(group_reader)
              group_fieldnames = group_reader.fieldnames or []
          required_group_columns = ["group_id", "match_type", "category", "filenames", "image_urls"]
          if group_fieldnames != required_group_columns:
              raise SystemExit(f"Unexpected image-groups.csv columns: {group_fieldnames}")
          if summary.get("group_count") != len(group_rows):
              raise SystemExit(f"Summary group_count {summary.get('group_count')} does not match group CSV rows {len(group_rows)}")

          print(f"OK: requested_limit={expected_requested_limit}, image-index.csv rows={len(rows)}, thumbnails={summary.get('thumbnail_saved_count')}, thumbnail_errors={summary.get('thumbnail_error_count')}, ai_enabled={summary.get('ai_classification_enabled')}, ai_reclassified={summary.get('ai_reclassified_count')}, image-groups.csv rows={len(group_rows)}, WordPress methods={sorted(methods) or ['GET']}, paginated query verified")
          PY

      - name: Write AI inference report
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path

          output = Path("wp-media-test-output")
          index_path = output / "image-index.csv"
          summary_path = output / "media-organizer-summary.json"
          report_path = output / "ai-inference-report.md"

          with index_path.open(newline="", encoding="utf-8") as file_obj:
              rows = list(csv.DictReader(file_obj))
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          categories = Counter(row["category"] for row in rows)
          priority_categories = [
              "car/lexus", "car/tanto",
              "genre/fishing", "genre/leisure", "genre/travel", "genre/gourmet",
              "location/hiroshima", "location/shimane", "location/tottori",
              "location/yamaguchi", "location/fukuoka", "location/oita", "location/awaji",
              "bird", "aquarium",
          ]

          lines = [
              "# WordPressメディア最新取得 AI推測レポート",
              "",
              "## 1. 取得件数",
              f"- リクエスト件数: {summary.get('requested_limit', len(rows))} 件",
              f"- 取得件数: {len(rows)} 件",
              f"- Summary fetched_count: {summary.get('fetched_count', len(rows))} 件",
              f"- Summary media_count: {summary.get('media_count')} 件",
              f"- 類似画像グループ数: {summary.get('group_count')} 件",
              f"- サムネイル保存件数: {summary.get('thumbnail_saved_count', 0)} 件",
              f"- サムネイル取得失敗件数: {summary.get('thumbnail_error_count', 0)} 件",
              f"- AI画像分類: {'有効' if summary.get('ai_classification_enabled') else '無効'}",
              f"- OpenAI model: {summary.get('ai_model') or 'なし'}",
              f"- AI分類対象上限: {summary.get('ai_limit', 0)} 件",
              f"- AI分類試行件数: {summary.get('ai_classified_count', 0)} 件",
              f"- AIでunknownから分類できた件数: {summary.get('ai_reclassified_count', 0)} 件",
              f"- AI分類エラー件数: {summary.get('ai_error_count', 0)} 件",
              f"- OpenAI HTTP status counts: {summary.get('ai_http_status_counts', {})}",
              f"- Latest OpenAI HTTP status: {summary.get('ai_last_http_status') or 'なし'}",
              f"- Latest OpenAI error message: {summary.get('ai_last_error_message') or 'なし'}",
              "",
              "## 2. image-index.csv サンプル5件",
              "",
              "| filename | title | category | ai_category | possible_article | upload_date |",
              "| --- | --- | --- | --- | --- | --- |",
          ]
          for row in rows[:5]:
              values = [row["filename"], row["title"], row["category"], row.get("ai_category", ""), row["possible_article"], row["upload_date"]]
              escaped = [value.replace("|", "\\|").replace("\n", " ") for value in values]
              lines.append("| " + " | ".join(escaped) + " |")
          if not rows:
              lines.append("| （該当なし） |  |  |  |  |  |")

          lines.extend(["", "## 3. 推測カテゴリ一覧"])
          if categories:
              for category, count in sorted(categories.items()):
                  lines.append(f"- `{category}`: {count} 件")
          else:
              lines.append("- 該当なし")

          lines.extend(["", "### 優先カテゴリ別ヒット状況"])
          for category in priority_categories:
              lines.append(f"- `{category}`: {categories.get(category, 0)} 件")

          lines.extend(["", "## 4. AI画像分類ログ サンプル"])
          ai_log_path = output / "ai-category-log.csv"
          if ai_log_path.exists():
              with ai_log_path.open(newline="", encoding="utf-8") as file_obj:
                  ai_rows = list(csv.DictReader(file_obj))
              if ai_rows:
                  lines.extend(["", "| filename | size | ai_category | final_category | status | HTTP | OpenAI error | reason |", "| --- | --- | --- | --- | --- | --- | --- | --- |"])
                  for row in ai_rows[:10]:
                      size = "x".join(value for value in [row.get("width", ""), row.get("height", "")] if value)
                      values = [row["filename"], size, row["ai_category"], row["final_category"], row["ai_status"], row.get("ai_http_status", ""), row.get("ai_openai_error_message", ""), row["ai_reason"]]
                      escaped = [value.replace("|", "\\|").replace("\n", " ") for value in values]
                      lines.append("| " + " | ".join(escaped) + " |")
              else:
                  lines.append("- AI分類ログなし（AI分類無効または対象なし）")
          else:
              lines.append("- ai-category-log.csv がありません")

          lines.extend(["", "## 5. possible_article サンプル"])
          for row in rows[:5]:
              lines.append(f"- {row['filename']}: {row['possible_article']}")
          if not rows:
              lines.append("- 該当なし")

          lines.extend([
              "",
              "## 6. 次段階の提案",
              "- CSVを確認し、`unknown` または意図と違うカテゴリのキーワードを追加する。",
              "- 保存済みの `thumbnails/` を確認し、分類キーワードや重複ハッシュ検出を調整する。",
              "- 記事テーマ別に `possible_article` の候補名を調整し、将来の『記事テーマ → 関連画像候補』表示に使える辞書を育てる。",
              "",
              "## 確認結果",
              f"- CSV構造: `image-index.csv` {len(rows)} 行、`image-groups.csv` {summary.get('group_count')} 行を検証済み。",
              "- エラーログ品質: 失敗時は `run.stderr.log` と `media-organizer-summary.json` を artifact に残します。",
              "",
              "## 安全確認",
              "- WordPress REST API とサムネイル取得は GET のみを許可し、検証ステップで POST/PUT/DELETE が run log に含まれていないことを確認しています。AI分類が有効な場合は保存済みサムネイルのみをOpenAI Responses APIへ送ります。",
              "- WordPress投稿、メディア削除、既存記事変更は実行しません。",
          ])

          report = "\n".join(lines) + "\n"
          report_path.write_text(report, encoding="utf-8")

          import os
          github_step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if github_step_summary:
              with Path(github_step_summary).open("a", encoding="utf-8") as summary_file:
                  summary_file.write(report)

          print(report)
          PY

      - name: Verify AI report contents
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          report_path = Path("wp-media-test-output/ai-inference-report.md")
          if not report_path.exists():
              raise SystemExit("ai-inference-report.md was not generated")
          report = report_path.read_text(encoding="utf-8")
          required_snippets = [
              "## 1. 取得件数",
              "## 2. image-index.csv サンプル5件",
              "## 3. 推測カテゴリ一覧",
              "### 優先カテゴリ別ヒット状況",
              "## 4. AI画像分類ログ サンプル",
              "## 5. possible_article サンプル",
              "## 6. 次段階の提案",
              "リクエスト件数",
              "Summary fetched_count",
              "サムネイル保存件数",
              "サムネイル取得失敗件数",
              "AI画像分類",
              "OpenAI model",
              "AI分類試行件数",
              "AIでunknownから分類できた件数",
              "## 安全確認",
              "car/lexus",
              "car/tanto",
              "genre/fishing",
              "genre/leisure",
              "genre/travel",
              "genre/gourmet",
              "location/hiroshima",
              "location/shimane",
              "location/tottori",
              "location/yamaguchi",
              "location/fukuoka",
              "location/oita",
              "location/awaji",
              "bird",
              "aquarium",
              "POST/PUT/DELETE",
              "WordPress投稿、メディア削除、既存記事変更は実行しません",
          ]
          missing = [snippet for snippet in required_snippets if snippet not in report]
          if missing:
              raise SystemExit(f"ai-inference-report.md is missing required content: {missing}")
          print("OK: ai-inference-report.md contains fetched count, category hits, possible_article samples, next steps, and safety confirmation")
          PY

      - name: Show sample CSV
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::image-index.csv sample"
          sed -n '1,6p' "${OUTPUT_DIR}/image-index.csv"
          echo "::endgroup::"

      - name: Write failure diagnosis report
        if: failure() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"
          python3 - <<'PY'
          from pathlib import Path

          output = Path("wp-media-test-output")
          report_path = output / "failure-diagnosis.md"

          def read_text(name, limit=12000):
              path = output / name
              if not path.exists():
                  return "（ファイルなし）"
              text = path.read_text(encoding="utf-8", errors="replace")
              if len(text) > limit:
                  return text[:limit] + "\n...（長いため省略）"
              return text or "（空ファイル）"

          report_lines = [
              "# WordPressメディア最新取得 失敗診断",
              "",
              "## 想定される確認ポイント",
              "",
              "- GitHub Secrets `WP_URL`, `WP_USER`, `WP_APP_PASSWORD` が設定されているか。",
              "- WordPress REST API `/wp-json/wp/v2/media` へ GitHub Actions から到達できるか。",
              "- Application Password が有効で、メディアの読み取り権限があるか。",
              "- `media-organizer-run-log.csv` に `GET` 以外が含まれていないか。",
              "- `media-organizer-summary.json` の `error` を確認する。",
              "",
              "## 安全確認",
              "",
              "この workflow は `scripts/organize_wp_media.py --latest-20 --limit <media_limit> --skip-posts` を実行し、AI分類が有効な場合のみ保存済みサムネイルをOpenAIへ送ります。WordPressへの投稿作成、記事更新、メディア削除、POST/PUT/DELETE は行いません。",
              "",
              "## media-organizer-summary.json",
              "",
              "```json",
              read_text("media-organizer-summary.json"),
              "```",
              "",
              "## run.stderr.log",
              "",
              "```text",
              read_text("run.stderr.log"),
              "```",
              "",
              "## media-organizer-run-log.csv",
              "",
              "```csv",
              read_text("media-organizer-run-log.csv"),
              "```",
          ]
          report = "\n".join(report_lines) + "\n"
          report_path.write_text(report, encoding="utf-8")
          print(report)

          import os
          github_step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if github_step_summary:
              with Path(github_step_summary).open("a", encoding="utf-8") as summary_file:
                  summary_file.write("\n" + report)
          PY

      - name: Upload media test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-media-latest-20-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT_DIR }}/image-index.csv
            ${{ env.OUTPUT_DIR }}/image-groups.csv
            ${{ env.OUTPUT_DIR }}/media-organizer-summary.json
            ${{ env.OUTPUT_DIR }}/media-organizer-run-log.csv
            ${{ env.OUTPUT_DIR }}/ai-category-log.csv
            ${{ env.OUTPUT_DIR }}/ai-inference-report.md
            ${{ env.OUTPUT_DIR }}/ai-preview/**
            ${{ env.OUTPUT_DIR }}/thumbnails/**
            ${{ env.OUTPUT_DIR }}/failure-diagnosis.md
            ${{ env.OUTPUT_DIR }}/run.stdout.log
            ${{ env.OUTPUT_DIR }}/run.stderr.log
          if-no-files-found: warn
          retention-days: 14